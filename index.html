  :root{
    --ink:#070B18; --panel:#101731; --panel-lit:#182346; --rule:#26325A;
    --text:#EDEBE6; --grass:#2DCC30;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--ink); color:var(--text);}
  body{
    font-family:'Work Sans',ui-rounded,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:max(26px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; min-height:100dvh;
  }
  .shell{width:100%; max-width:760px; margin:auto 0;}

  header{text-align:center;}
  .wordmark{
    font-family:'Archivo Black',system-ui,sans-serif;
    font-size:clamp(40px,11.5vw,74px); line-height:1; letter-spacing:.02em; margin:0;
  }
  .wordmark span{display:block; color:var(--grass);
    font-size:clamp(17px,4.8vw,29px); letter-spacing:.34em; margin-top:11px; padding-left:.34em;}


  .games{
    display:grid; gap:12px; margin:40px 0 0;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  }
  .game{
    display:flex; flex-direction:column; align-items:center; gap:13px;
    text-decoration:none; color:inherit;
    background:var(--panel); border:2px solid var(--rule); border-radius:13px;
    padding:24px 16px 20px; transition:border-color .12s, background .12s, transform .08s;
  }
  .game:hover{background:var(--panel-lit); border-color:var(--grass);}
  .game:active{transform:scale(.99);}
  .game:focus-visible{outline:3px solid var(--text); outline-offset:3px;}
  .emblem{width:62px; height:62px;
    display:flex; align-items:center; justify-content:center; font-size:54px; line-height:1;}
  .emblem img{width:100%; height:100%; display:block;}
  .game h2{font-family:'Archivo Black',system-ui,sans-serif;
    font-size:19px; margin:0; letter-spacing:.01em;}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
