  /* ---------- Shared tokens. Identical in index, football, soccer and golf —
     change one, change all four. These were named --ink/--panel/--panel-lit/
     --rule here and --bg/--surface/--surface-2/--line in the games, which made
     the front door look hand-built rather than part of the set. ---------- */
  :root{
    --bg:#070B18; --surface:#101731; --surface-2:#182346;
    --text:#EDEBE6; --muted:#8891A0;
    --grass:#2DCC30; --grass-dim:rgba(45,204,48,0.14);
    --blue:#4E6BE8; --blue-dim:rgba(78,107,232,0.16);
    --line:rgba(237,235,230,0.12);
    --r-tile:10px;   /* pickers and panels */
    --r-btn:8px;     /* buttons and selects */
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Press Start 2P',ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
    padding:max(26px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; min-height:100dvh;
  }
  .shell{width:100%; max-width:420px; margin:0 auto;}

  header{text-align:center;}
  /* ---------- Shared wordmark. The same lockup the three games carry, at the
     larger size the front door gets. ---------- */
  .wordmark{
    font-family:'Press Start 2P',ui-monospace,monospace; text-transform:uppercase;
    font-size:clamp(23px,7.2vw,46px); line-height:1.2;
    letter-spacing:0; word-spacing:-0.3em; margin:8px 0 0;
  }
  .wordmark span{display:block; color:var(--grass); word-spacing:normal;
    font-size:clamp(11px,3.2vw,20px); letter-spacing:.3em; margin-top:8px; padding-left:.3em;}


  .games{ display:grid; gap:12px; margin:26px 0 0; grid-template-columns:1fr; }
  .game{
    display:flex; flex-direction:column; align-items:center; gap:13px;
    text-decoration:none; color:inherit;
    background:var(--surface); border:2px solid var(--line); border-radius:var(--r-tile);
    padding:24px 16px 20px; transition:border-color .12s, background .12s, transform .08s;
  }
  .game:hover{background:var(--surface-2); border-color:var(--grass);}
  .game:active{transform:scale(.99);}
  .game:focus-visible{outline:3px solid var(--text); outline-offset:3px;}
  .emblem{width:62px; height:62px;
    display:flex; align-items:center; justify-content:center; font-size:54px; line-height:1;}
  .emblem img{width:100%; height:100%; display:block;}
  .game h2{font-family:'Press Start 2P',ui-monospace,monospace;
    font-size:13px; margin:0; letter-spacing:0;}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1 class="wordmark">SMALL BALL<span>GAMES</span></h1>
    </header>

    <!-- Adding a game is one block: emblem and name. The grid reflows itself. -->
    <main class="games">
      <a class="game" href="/football.html">
        <span class="emblem" aria-hidden="true">🏈</span>
        <h2>Football</h2>
      </a>

      <a class="game" href="/soccer.html">
        <span class="emblem" aria-hidden="true">⚽️</span>
        <h2>Soccer</h2>
      </a>

      <a class="game" href="/golf.html">
        <span class="emblem" aria-hidden="true">⛳️</span>
        <h2>Golf</h2>
      </a>
    </main>
  </div>
</body>
</html>
